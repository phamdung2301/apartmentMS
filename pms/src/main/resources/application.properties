# --- Docker Compose Config (Disabled) ---
spring.docker.compose.enabled=false

# --- PostgreSQL (Active Default) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/pms
spring.datasource.username=postgres
spring.datasource.password=phamdung.2301
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Hibernate Properties ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SPRING SECURITY & THYMELEAF CONFIG
# ==========================================
spring.thymeleaf.cache=false

# ==========================================
# SYSTEM & BUSINESS PARAMETERS
# ==========================================
# Room Utility Rates
pms.utility.price-per-kwh=3500
pms.utility.price-per-m3=15000

# VietQR Configuration
pms.vietqr.bank-id=MB
pms.vietqr.account-no=0999999999
pms.vietqr.account-name=NGUYEN VAN A

# Scheduler properties (cron runs day 5 of every month at 00:00)
# For testing/demo purposes, we can also trigger manually or use a shorter interval if needed.
pms.scheduler.cron=0 0 0 5 * *

# ==========================================
# MAIL CONFIGURATION (Mocked in service, can configure SMTP here)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
